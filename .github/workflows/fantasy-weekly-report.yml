name: Fantasy Football Weekly Report

on:
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        required: false
        default: "report"
        type: choice
        options:
          - report
          - player
          - freeagents
      player_name:
        description: "Player full name (only used when command is 'player')"
        required: false
        default: ""
      position:
        description: "Position, e.g. D/ST, RB, WR (only used when command is 'freeagents')"
        required: false
        default: "D/ST"
      today_only:
        description: "Only show free agents whose pro team plays today (only used when command is 'freeagents')"
        required: false
        type: boolean
        default: true
  # Scheduling moved to a Claude Code Routine, which calls this workflow via
  # the GitHub API on the same weekly cadence — GitHub Actions' own `schedule`
  # trigger was unreliable here (observed delays of 3+ hours past the target time).

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fantasy-football-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run command
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
          ESPN_SEASON_YEAR: ${{ secrets.ESPN_SEASON_YEAR }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          COMMAND: ${{ github.event.inputs.command }}
          PLAYER_NAME: ${{ github.event.inputs.player_name }}
          POSITION: ${{ github.event.inputs.position }}
          TODAY_ONLY: ${{ github.event.inputs.today_only }}
        run: |
          if [ "$COMMAND" = "player" ]; then
            python main.py player --name "$PLAYER_NAME"
          elif [ "$COMMAND" = "freeagents" ]; then
            if [ "$TODAY_ONLY" = "false" ]; then
              python main.py freeagents --position "$POSITION"
            else
              python main.py freeagents --position "$POSITION" --today
            fi
          else
            python main.py report
          fi

      - name: Post report as a GitHub issue
        if: ${{ github.event.inputs.command == 'report' || github.event.inputs.command == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WEEK_TITLE=$(head -n 1 reports/latest.md | sed 's/^# //')
          gh issue create --title "$WEEK_TITLE" --body-file reports/latest.md
